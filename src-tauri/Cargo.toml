[package]
name = "s3-studio"
version = "0.3.1"
description = "A beautiful cross-platform S3 workspace"
authors = ["S3 Studio"]
edition = "2021"
rust-version = "1.91.1"

[lib]
name = "s3_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
s3-studio-core = { path = "../src-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-smithy-types = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
mime_guess = "2"
url = "2"
percent-encoding = "2"
tauri-plugin-updater = "2.13.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
semver = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-opener = "2"

[dev-dependencies]
tiny_http = "0.12"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
