name: Desktop builds
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS signer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          signer=apple-codesign-0.29.0-macos-universal
          archive="$RUNNER_TEMP/$signer.tar.gz"
          curl -fsSL --retry 3 --max-time 90 -o "$archive" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/$signer.tar.gz"
          printf '%s  %s\n' d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d "$archive" | shasum -a 256 -c
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/$signer" >> "$GITHUB_PATH"
      - name: Verify macOS keychain identity across builds
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: bash tests/macos-keychain.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-nsh
            src-core
          cache-on-failure: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential file libdbus-1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libasound2-dev libx11-xcb-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev libclang-dev mesa-vulkan-drivers xvfb x11-utils desktop-file-utils
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress --version=3.11.0
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          gh release download wix3141rtm --repo wixtoolset/wix3 --pattern wix314-binaries.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'WiX download failed' }
          if ((Get-FileHash $archive).Hash.ToLowerInvariant() -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') {
            throw 'WiX checksum mismatch'
          }
          $tools = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          "WIX_BIN=$tools" >> $env:GITHUB_ENV
      - name: Test release signatures
        run: node --test tests/update-signature.test.mjs
      - name: Rust tests
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path src-core/Cargo.toml 2>&1 | tee rust-tests.log
          result=${PIPESTATUS[0]}
          printf '### Rust tests\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 rust-tests.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then node scripts/annotate-ci.mjs rust-tests.log; fi
          exit "$result"
      - name: Native Shell UI and updater tests
        run: cargo test --locked --manifest-path src-nsh/Cargo.toml
      - name: Build Native Shell executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            node scripts/build-native.mjs --universal
          else
            node scripts/build-native.mjs
          fi
      - name: Linux native startup
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a bash scripts/smoke-linux.sh
      - name: Windows native startup
        if: runner.os == 'Windows'
        run: ./scripts/smoke-desktop.ps1
      - name: Windows startup diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-diagnostics
          path: artifacts/native-startup*
          if-no-files-found: ignore
      - name: Build desktop installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          S3_STUDIO_REQUIRE_MACOS_SIGNATURE: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') }}
          S3_STUDIO_MACOS_SIGNING_P12: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && secrets.S3_STUDIO_MACOS_SIGNING_P12 || '' }}
          S3_STUDIO_MACOS_SIGNING_PASSWORD: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && secrets.S3_STUDIO_MACOS_SIGNING_PASSWORD || '' }}
        run: |
          set +e
          node scripts/package-native.mjs 2>&1 | tee desktop-build.log
          result=${PIPESTATUS[0]}
          printf '### Desktop installers\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 desktop-build.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then node scripts/annotate-ci.mjs desktop-build.log; fi
          exit "$result"
      - name: Run the packaged AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dbus-run-session -- xvfb-run -a bash scripts/smoke-linux.sh src-nsh/target/installer/bundle/*.AppImage
      - name: Verify Windows installer upgrades
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/smoke-windows-installers.ps1
      - name: Preserve installer diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: ${{ runner.temp }}/s3-studio-installer-smoke/*.log
          if-no-files-found: ignore
      - name: Build and test Omarchy package
        if: runner.os == 'Linux'
        run: bash scripts/build-omarchy.sh src-nsh/target/installer/bundle/*.deb artifacts/omarchy
      - uses: actions/upload-artifact@v4
        with:
          name: s3-studio-${{ matrix.os }}
          path: |
            src-nsh/target/installer/bundle/*.msi
            src-nsh/target/installer/bundle/*.exe
            src-nsh/target/installer/bundle/*.deb
            src-nsh/target/installer/bundle/*.AppImage
            src-nsh/target/installer/bundle/*.dmg
            artifacts/omarchy/*.pkg.tar.zst
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: s3-studio-*
          path: artifacts/release-input
      - name: Compile update signer
        run: cargo build --locked --manifest-path packaging/signing/Cargo.toml
      - name: Sign in-app update packages
        env:
          S3_STUDIO_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S3_STUDIO_UPDATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mapfile -d '' installers < <(find artifacts/release-input -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' \) -print0)
          test "${#installers[@]}" -eq 3
          packaging/signing/target/debug/sign-s3-studio-update "${installers[@]}"
      - name: Verify and collect all three platforms
        run: node scripts/prepare-release.mjs artifacts/release-input artifacts/release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs artifacts/release
