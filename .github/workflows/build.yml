name: Desktop builds
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis,msi"
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: npm ci
      - run: npm test
      - name: Rust tests
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee rust-tests.log
          result=${PIPESTATUS[0]}
          printf '### Rust tests\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 rust-tests.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then node scripts/annotate-ci.mjs rust-tests.log; fi
          exit "$result"
      - name: Build desktop installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.os != 'macOS' && github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ runner.os != 'macOS' && github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          update_args=()
          if [ "$RUNNER_OS" != "macOS" ]; then
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              update_args=(--config src-tauri/tauri.release.conf.json)
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo 'Missing TAURI_SIGNING_PRIVATE_KEY for release signing' >&2
              exit 1
            fi
          fi
          set +e
          npm run tauri build -- ${{ matrix.args }} "${update_args[@]}" 2>&1 | tee desktop-build.log
          result=${PIPESTATUS[0]}
          printf '### Desktop installers\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 desktop-build.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then node scripts/annotate-ci.mjs desktop-build.log; fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: s3-studio-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: s3-studio-*
          path: artifacts/release-input
      - name: Verify and collect all three platforms
        run: node scripts/prepare-release.mjs artifacts/release-input artifacts/release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs artifacts/release
